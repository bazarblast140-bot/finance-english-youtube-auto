name: Quiz Pathshala trend research

# Roz ka competitor + trend snapshot. Upload workflow se ALAG.
# IST 07:45 = 02:15 UTC. Upload cron (06:00, 12:00, 14:30, 16:00, 19:00 UTC)
# se nahi takrata, aur alag concurrency group hai — upload kabhi block nahi hota.
#
# Quota: search.list = 100. Typical ~405 units (4 searches + list calls).
# Code hard cap 1,200 (1,500 se neeche). quotaExceeded par exit 0, uploads
# nahi ruke.
#
# SECRET (optional): YT_DATA_API_KEY — ALAG Google Cloud project ki key.
# Yahan YOUTUBE_* / OAuth bilkul pass nahi hota. Key na ho to job skip, exit 0.
# Upload-quota wala OAuth fallback is workflow mein set nahi hota; script use refuse karti hai.

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "20h ke andar dubara API call (quota kharch)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: quiz-pathshala-trends
  cancel-in-progress: false

defaults:
  run:
    working-directory: kids-quiz-shorts

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kids-quiz-shorts/requirements.txt

      - run: pip install -r requirements.txt

      - name: YouTube + RSS trends
        env:
          YT_DATA_API_KEY: ${{ secrets.YT_DATA_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}" = "true" ]; then
            python src/trend_research.py --force
          else
            python src/trend_research.py --max-age-hours 20
          fi

      - name: Review-only candidate questions
        run: python src/propose_questions.py

      - name: trends.json + report push (retry)
        run: |
          set -euo pipefail
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          ARGS=()
          if [ -f data/trend_manifest.txt ]; then
            while IFS= read -r f; do
              if [ -z "$f" ]; then
                continue
              fi
              if [ -f "$f" ]; then
                ARGS+=(--extra "$f")
              fi
            done < data/trend_manifest.txt
          fi
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "[trends] commit karne ko kuch nahi"
            exit 0
          fi
          # text-files false: LAST_RUN.md / competitor_insights.json ko is
          # reset-and-push se overwrite mat karo (upload job unka malik hai).
          python src/sync_state.py --branch "${{ github.ref_name }}" \
            --include-used false --text-files false --attempts 5 \
            --message "chore(quiz): daily trend research [skip ci]" \
            "${ARGS[@]}"
