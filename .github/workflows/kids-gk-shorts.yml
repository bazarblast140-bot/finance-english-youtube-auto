name: Kids GK Quiz Shorts

# IST = UTC + 5:30 — roz 5 video
#   07:30 IST -> 02:00 UTC  (morning: school jaane se pehle)
#   13:30 IST -> 08:00 UTC  (noon:    lunch / ghar pe)
#   16:00 IST -> 10:30 UTC  (paheli:  school ke baad, riddle)
#   17:30 IST -> 12:00 UTC  (evening: homework se pehle)
#   20:30 IST -> 15:00 UTC  (night:   khaane ke baad)
# GitHub cron on-time NAHI hai. 27 Aug ko runs 3-4 ghante late chale (07:30 IST
# wala 00:08 baje raat ko). Isliye cron ab sirf BUILD trigger hai — publish
# time YouTube ke publishAt se aata hai, jo second-perfect hota hai.
#
# CHANNEL: wahi channel jo pehle "The Money Rule" tha — Rajesh ne rename karke
# kids GK bana diya hai. Isliye repo ke maujuda YOUTUBE_* secrets hi use ho rahe
# hain; alag KIDS_YT_* ki zaroorat nahi. Purana finance cron paused hai.

on:
  schedule:
    # Ye BUILD time hai, publish time nahi. Har cron target se ~90 min pehle
    # chalta hai; video 'private + publishAt' se upload hoti hai aur YouTube
    # use exact IST time pe khud public karta hai. GitHub ka cron 3-4 ghante
    # late bhi chale to publish time nahi hilta.
    - cron: "30 0 * * *"    # -> morning 07:30 IST
    - cron: "30 6 * * *"    # -> noon    13:30 IST
    - cron: "0 9 * * *"     # -> paheli  16:00 IST
    - cron: "30 10 * * *"   # -> evening 17:30 IST
    - cron: "30 13 * * *"   # -> night   20:30 IST
  workflow_dispatch:
    inputs:
      slot:
        description: "kaunsa slot"
        type: choice
        options: [morning, noon, paheli, evening, night]
        default: morning
      privacy:
        description: "unlisted / public / private"
        type: choice
        options: [unlisted, public, private]
        default: unlisted

permissions:
  contents: write

concurrency:
  group: kids-quiz-shorts
  cancel-in-progress: false

defaults:
  run:
    working-directory: kids-quiz-shorts

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Slot decide karo
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}"       >> $GITHUB_OUTPUT
            echo "privacy=${{ inputs.privacy }}" >> $GITHUB_OUTPUT
          else
            # cron -> slot mapping. Naya slot jodo to yahan aur config.py
            # ke SLOT_ORDER, dono jagah add karna.
            case "${{ github.event.schedule }}" in
              "30 0 * * *")  SLOT=morning ;;
              "30 6 * * *")  SLOT=noon ;;
              "0 9 * * *")   SLOT=paheli ;;
              "30 10 * * *") SLOT=evening ;;
              "30 13 * * *") SLOT=night ;;
              *)             SLOT=morning ;;
            esac
            echo "slot=$SLOT"     >> $GITHUB_OUTPUT
            echo "privacy=public" >> $GITHUB_OUTPUT
          fi

      - name: System deps (ffmpeg + Devanagari + emoji fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-indic libraqm0 \
            fonts-noto-color-emoji
          fc-cache -f
          # Emoji font chup-chaap gayab ho jaaye to option icons bina bataye
          # hat jaate hain — isliye yahin check kar lete hain.
          fc-list | grep -qi emoji && echo "emoji font OK" || echo "::warning::emoji font missing - option icons nahi dikhenge"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Video banao
        env:
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL:    ${{ vars.ELEVENLABS_MODEL || 'eleven_multilingual_v2' }}
        run: |
          python src/build.py --slot ${{ steps.slot.outputs.slot }} | tee build_out.txt
          # ElevenLabs chup-chaap fail hoke free voice pe chala jaaye to pata
          # chalna chahiye — warna mahino tak galat voice publish hoti rahegi.
          if grep -q "voice: edge" build_out.txt; then
            echo "::warning::ElevenLabs fail hua - free Swara voice pe chala. Log dekho."
          fi

      - name: Voice check — silent video upload mat hone do
        run: |
          DIR=$(ls -td out/*/ | head -1)
          MEAN=$(ffmpeg -i "$DIR"/*.mp4 -af volumedetect -f null - 2>&1 \
                 | grep mean_volume | awk '{print $5}')
          echo "mean_volume = $MEAN dB"
          python -c "import sys; m=float('$MEAN'); sys.exit('VOICE MISSING - TTS fail hua, upload rok diya.') if m < -34 else None"

      - uses: actions/upload-artifact@v4
        with:
          name: kids-short-${{ steps.slot.outputs.slot }}-${{ github.run_number }}
          path: kids-quiz-shorts/out/*/
          retention-days: 14
      - name: YouTube pe upload
        id: up
        continue-on-error: true
        env:
          YT_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          DIR=$(ls -td out/*/ | head -1)
          set -o pipefail
          python src/upload.py --dir "${DIR%/}" \
            --privacy ${{ steps.slot.outputs.privacy }} \
            --publish-slot "${{ steps.slot.outputs.slot }}" 2>&1 | tee upload_out.txt

      - name: Telegram pe batao
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DIR=$(ls -td out/*/ | head -1)
          python src/notify.py --dir "${DIR%/}" \
            --slot "${{ steps.slot.outputs.slot }}" \
            --privacy "${{ steps.slot.outputs.privacy }}" \
            --upload "${{ steps.up.outcome }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # CI logs Azure blob pe hote hain jo har network se readable nahi. Isliye
      # last run ka nateeja repo me hi likh dete hain — mobile se bhi dikh jaaye.
      - name: Last run ka status repo me likho
        if: always()
        run: |
          DIR=$(ls -td out/*/ | head -1)
          {
            echo "# Last run"
            echo "- when   : $(date -u +'%F %H:%M UTC')"
            echo "- slot   : ${{ steps.slot.outputs.slot }}"
            echo "- privacy: ${{ steps.slot.outputs.privacy }}"
            echo "- upload : ${{ steps.up.outcome }}"
            echo
            echo '## metadata'
            python -c "import json;m=json.load(open('$DIR/metadata.json'));print(chr(10).join(f'- {k}: {m[k]}' for k in ('title','duration_sec','voice_engines','youtube_url','scheduled_for') if k in m))" || true
            echo
            echo '## upload output (tail)'
            echo '```'
            tail -n 40 upload_out.txt 2>/dev/null || echo "(upload step chala hi nahi)"
            echo '```'
            echo
            echo '## voice'
            echo '```'
            grep -E '^\[tts\]|voice:' build_out.txt 2>/dev/null | head -12 || echo '(none)'
            echo '```'
            echo
            echo '## telegram'
            echo '```'
            cat telegram_out.txt 2>/dev/null || echo "(telegram step chala hi nahi)"
            echo '```'
          } > LAST_RUN.md

      - name: used.json + LAST_RUN.md commit karo
        if: always()
        run: |
          git config user.name  "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          # Sawaal tabhi "use ho gaya" mana jaaye jab upload sach me hua ho —
          # warna fail hue run ke sawaal hamesha ke liye bank se gayab ho jaate.
          if [ "${{ steps.up.outcome }}" = "success" ]; then
            git add data/used.json
          else
            git checkout -- data/used.json || true
          fi
          git add LAST_RUN.md
          git diff --staged --quiet || git commit -m "chore(kids-gk): ${{ steps.slot.outputs.slot }} run — upload ${{ steps.up.outcome }} [skip ci]"
          git pull --rebase --autostash || true
          git push

      - name: Upload fail hua to job fail karo
        if: steps.up.outcome != 'success'
        run: |
          echo "Upload fail hua. Detail: kids-quiz-shorts/LAST_RUN.md"
          exit 1
