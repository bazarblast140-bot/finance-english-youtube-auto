name: Quiz Pathshala GK Shorts

# IST = UTC + 5:30 — roz 5 video
# Audience: general — teens, adults, competitive-exam / GK fans.
# MADE_FOR_KIDS = False (Rajesh ka faisla, 01-Oct-2026).
#   07:30 IST -> 02:00 UTC  (morning: subah ki chai / commute)
#   13:30 IST -> 08:00 UTC  (noon:    lunch break)
#   16:00 IST -> 10:30 UTC  (paheli:  shaam se pehle, riddle)
#   17:30 IST -> 12:00 UTC  (evening: office / padhai ke baad)
#   20:30 IST -> 15:00 UTC  (night:   khaane ke baad)
#
# GitHub cron on-time NAHI hai — regularly drop ya 10-20 ghante late.
# Asli schedule quiz-catchup.yml hai: har ghante kai baar planner chalta hai
# aur jo slot agle 36 ghante me khali hai uske liye is workflow ko slot+date
# ke saath dispatch karta hai (privacy=public → private + publishAt).
# Ye crons backup hain. Plan job coverage dekhta hai:
#   - aaj ka slot abhi baaki hai aur khali hai → aaj schedule (≤10 min → turant public)
#   - aaj ka slot nikal gaya → sabse nazdeek khali slot, KAL wahi slot nahi
#     jab wo pehle se scheduled/public ho
#   - slot+date par video hai → skip (duplicate upload nahi)
# Buffer = YouTube par agle 24-36h ki scheduled videos. Alag pre-render cache nahi.
#
# CHANNEL: QUIZ PATHSHALA (YOUTUBE_* secrets)
#
# Optional repo VARIABLES (Settings > Secrets and variables > Actions > Variables):
#   QUIZ_ACTIVE_SLOTS   e.g. "morning,paheli,night" — baaki slot bina upload skip
#                       (khaali = saare 5). Upload frequency yahin se badlo.
#                       Slot step me padha jaata hai + build step ko env me jaata hai.
#   QUIZ_SUBSCRIBE_CTA  end (default) | before_answer | off
#   QUIZ_TTS_PROVIDER   edge (default, free) | elevenlabs
# Optional SECRET:
#   YT_DATA_API_KEY     competitor research (src/competitor_research.py). Na ho to skip.
#                       ALAG Google Cloud project ki key ho — upload OAuth ka quota
#                       (10k/din, 5 upload = ~8k) research me kabhi nahi jaata.
# Quota order: upload PEHLE; research + pending comments sirf upload success ke BAAD.
# Pinned comment ke liye YOUTUBE_REFRESH_TOKEN me youtube.force-ssl scope chahiye
# (README: "Pinned comment ke liye token").

on:
  schedule:
    # BUILD time (publish time nahi). Target se ~20h pehle.
    # Target UTC -> cron UTC (previous calendar day for morning/noon-ish slots)
    - cron: "0 6 * * *"     # -> morning 07:30 IST  (target 02:00 UTC, fire 06:00 prev day)
    - cron: "0 12 * * *"    # -> noon    13:30 IST  (target 08:00 UTC, fire 12:00 prev day)
    - cron: "30 14 * * *"   # -> paheli  16:00 IST  (target 10:30 UTC, fire 14:30 prev day)
    - cron: "0 16 * * *"    # -> evening 17:30 IST  (target 12:00 UTC, fire 16:00 prev day)
    - cron: "0 19 * * *"    # -> night   20:30 IST  (target 15:00 UTC, fire 19:00 prev day)
  workflow_dispatch:
    inputs:
      slot:
        description: "kaunsa slot"
        type: choice
        options: [morning, noon, paheli, evening, night]
        default: morning
      privacy:
        description: "unlisted / public / private. Catch-up hamesha public bhejta hai taaki publishAt lage."
        type: choice
        options: [unlisted, public, private]
        default: unlisted
      date:
        description: "IST date YYYY-MM-DD. Catch-up set karta hai. Khaali = planner decide kare."
        type: string
        required: false
        default: ""

permissions:
  contents: write

# Dispatch path: one group per slot+date so two catch-up runs cannot both
# build morning 2026-10-03. Schedule crons do not know the date until the
# planner runs, so they use the cron expression; the attempts file is the
# lock shared with the dispatcher.
concurrency:
  group: quiz-slot-${{ inputs.slot || github.event.schedule }}-${{ inputs.date || 'auto' }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: kids-quiz-shorts

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      action: ${{ steps.prep.outputs.action }}
      slot: ${{ steps.prep.outputs.slot }}
      date: ${{ steps.prep.outputs.date }}
      privacy: ${{ steps.prep.outputs.privacy }}
      publish_at: ${{ steps.prep.outputs.publish_at }}
      immediate: ${{ steps.prep.outputs.immediate }}
      reason: ${{ steps.prep.outputs.reason }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Coverage decide (list calls only — no upload)
        id: prep
        env:
          YT_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          QUIZ_ACTIVE_SLOTS: ${{ vars.QUIZ_ACTIVE_SLOTS }}
        run: |
          git config user.name  "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          python src/slot_planner.py prepare \
            --event "${{ github.event_name }}" \
            --slot "${{ inputs.slot }}" \
            --date "${{ inputs.date }}" \
            --privacy "${{ github.event_name == 'schedule' && 'public' || inputs.privacy }}" \
            --schedule "${{ github.event.schedule }}" \
            --branch "${{ github.ref_name }}" \
            --push
          echo "plan: $(grep -E '^(action|slot|date|reason|immediate|publish_at)=' "$GITHUB_OUTPUT" | tr '\n' ' ')"

  make-and-upload:
    needs: plan
    if: needs.plan.outputs.action == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Slot decide karo
        id: slot
        run: |
          # Plan job ne coverage dekh li. Yahan sirf uska faisla aage badhta hai.
          # QUIZ_ACTIVE_SLOTS planner me respect hota hai (public runs).
          echo "slot=${{ needs.plan.outputs.slot }}" >> $GITHUB_OUTPUT
          echo "privacy=${{ needs.plan.outputs.privacy }}" >> $GITHUB_OUTPUT
          echo "date=${{ needs.plan.outputs.date }}" >> $GITHUB_OUTPUT
          echo "publish_at=${{ needs.plan.outputs.publish_at }}" >> $GITHUB_OUTPUT
          echo "immediate=${{ needs.plan.outputs.immediate }}" >> $GITHUB_OUTPUT
          echo "active=true" >> $GITHUB_OUTPUT
          echo "decided slot=${{ needs.plan.outputs.slot }} date=${{ needs.plan.outputs.date }} immediate=${{ needs.plan.outputs.immediate }} reason=${{ needs.plan.outputs.reason }}"

      - name: System deps (ffmpeg + Devanagari + emoji fonts)
        if: steps.slot.outputs.active == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-indic libraqm0 \
            fonts-noto-color-emoji
          fc-cache -f
          # Emoji font chup-chaap gayab ho jaaye to option icons bina bataye
          # hat jaate hain — isliye yahin check kar lete hain.
          fc-list | grep -qi emoji && echo "emoji font OK" || echo "::warning::emoji font missing - option icons nahi dikhenge"

      - uses: actions/setup-python@v5
        if: steps.slot.outputs.active == 'true'
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt
        if: steps.slot.outputs.active == 'true'

      - name: Video banao
        if: steps.slot.outputs.active == 'true'
        env:
          # Default Edge (free). ElevenLabs sirf QUIZ_TTS_PROVIDER=elevenlabs par.
          QUIZ_TTS_PROVIDER:   ${{ vars.QUIZ_TTS_PROVIDER || 'edge' }}
          ELEVENLABS_API_KEY:  ${{ vars.QUIZ_TTS_PROVIDER == 'elevenlabs' && secrets.ELEVENLABS_API_KEY || '' }}
          ELEVENLABS_VOICE_ID: 7qBNUtXRGP0jPi0H4r8k
          ELEVENLABS_MODEL:    ${{ vars.ELEVENLABS_MODEL || 'eleven_multilingual_v2' }}
          QUIZ_ACTIVE_SLOTS:   ${{ vars.QUIZ_ACTIVE_SLOTS }}
          QUIZ_SUBSCRIBE_CTA:  ${{ vars.QUIZ_SUBSCRIBE_CTA || 'end' }}
          # Khaali = 1 sawaal (default). "2" = purana 2-sawaal format.
          QUIZ_QUESTIONS_PER_VIDEO: ${{ vars.QUIZ_QUESTIONS_PER_VIDEO }}
        run: |
          # pipefail zaroori hai — warna 'python ... | tee' me python crash ho
          # jaaye to bhi tee ka exit 0 aata hai aur step GREEN dikhta hai.
          # Isi wajah se ek crash chup-chaap nikal gaya tha.
          set -o pipefail
          python src/build.py --slot ${{ steps.slot.outputs.slot }} | tee build_out.txt
          # Edge default hai. Warning sirf tab jab ElevenLabs maanga ho aur
          # wo fail hokar Edge pe gir jaaye.
          if [ "$QUIZ_TTS_PROVIDER" = "elevenlabs" ] && grep -q "voice: edge" build_out.txt; then
            echo "::warning::ElevenLabs fail hua - free Swara voice pe chala. Log dekho."
          fi

      - name: Voice check — silent video upload mat hone do
        if: steps.slot.outputs.active == 'true'
        run: |
          DIR=$(ls -td out/*/ | head -1)
          MEAN=$(ffmpeg -i "$DIR"/*.mp4 -af volumedetect -f null - 2>&1 \
                 | grep mean_volume | awk '{print $5}')
          echo "mean_volume = $MEAN dB"
          python -c "import sys; m=float('$MEAN'); sys.exit('VOICE MISSING - TTS fail hua, upload rok diya.') if m < -34 else None"

      - uses: actions/upload-artifact@v4
        if: steps.slot.outputs.active == 'true'
        with:
          name: quiz-short-${{ steps.slot.outputs.slot }}-${{ github.run_number }}
          path: kids-quiz-shorts/out/*/
          retention-days: 14

      - name: YouTube pe upload
        id: up
        if: steps.slot.outputs.active == 'true'
        continue-on-error: true
        env:
          YT_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          DIR=$(ls -td out/*/ | head -1)
          set +e
          set -o pipefail
          PRIV="${{ steps.slot.outputs.privacy }}"
          SLOT="${{ steps.slot.outputs.slot }}"
          DATE="${{ steps.slot.outputs.date }}"
          IMM="${{ steps.slot.outputs.immediate }}"
          PUB="${{ steps.slot.outputs.publish_at }}"
          {
            if [ "$PRIV" != "public" ]; then
              python src/upload.py --dir "${DIR%/}" --privacy "$PRIV" --skip-coverage-check
            elif [ "$IMM" = "true" ] || [ -z "$PUB" ]; then
              python src/upload.py --dir "${DIR%/}" --privacy public \
                --target-slot "$SLOT" --target-date "$DATE"
            else
              python src/upload.py --dir "${DIR%/}" --privacy public \
                --publish-at "$PUB" --target-slot "$SLOT" --target-date "$DATE"
            fi
          } 2>&1 | tee upload_out.txt
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "UPLOAD_SKIPPED=duplicate — slot already covered"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          exit "$code"

      # Quota guard: ye dono upload ke BAAD, aur sirf jab upload success hua.
      # Upload fail (jaise quotaExceeded) hua to aur units nahi jalate.
      - name: Competitor research (optional, read-only, sirf API key se)
        if: steps.slot.outputs.active == 'true' && steps.up.outcome == 'success' && steps.up.outputs.skipped != 'true'
        continue-on-error: true
        env:
          YT_DATA_API_KEY:  ${{ secrets.YT_DATA_API_KEY }}
        run: python src/competitor_research.py --max-age-hours 20

      - name: Pending comments (public ho chuki videos par, max 3 try/video)
        if: steps.slot.outputs.active == 'true' && steps.up.outcome == 'success'
        continue-on-error: true
        env:
          YT_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python src/upload.py --post-pending-comments

      - name: Telegram pe batao
        if: always() && steps.slot.outputs.active == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DIR=$(ls -td out/*/ | head -1)
          python src/notify.py --dir "${DIR%/}" \
            --slot "${{ steps.slot.outputs.slot }}" \
            --privacy "${{ steps.slot.outputs.privacy }}" \
            --upload "${{ steps.up.outputs.skipped == 'true' && 'skipped' || steps.up.outcome }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # CI logs Azure blob pe hote hain jo har network se readable nahi. Isliye
      # last run ka nateeja repo me hi likh dete hain — mobile se bhi dikh jaaye.
      - name: Last run ka status repo me likho
        if: always() && steps.slot.outputs.active == 'true'
        run: |
          DIR=$(ls -td out/*/ | head -1)
          {
            echo "# Last run"
            echo "- when   : $(date -u +'%F %H:%M UTC')"
            echo "- slot   : ${{ steps.slot.outputs.slot }}"
            echo "- privacy: ${{ steps.slot.outputs.privacy }}"
            echo "- upload : ${{ steps.up.outcome }}"
            echo
            echo '## metadata'
            python -c "import json;m=json.load(open('$DIR/metadata.json'));print(chr(10).join(f'- {k}: {m[k]}' for k in ('title','duration_sec','voice_engines','youtube_url','scheduled_for') if k in m))" || true
            echo
            echo '## upload output (tail)'
            echo '```'
            tail -n 40 upload_out.txt 2>/dev/null || echo "(upload step chala hi nahi)"
            echo '```'
            echo
            echo '## pick / hook (repeat + bank stock)'
            echo '```'
            grep -E '^\[pick\]|^\[hook\]' build_out.txt 2>/dev/null | head -12 || echo '(none)'
            echo '```'
            echo
            echo '## voice'
            echo '```'
            grep -E '^\[tts\]|voice:' build_out.txt 2>/dev/null | head -12 || echo '(none)'
            echo '```'
            echo
            echo '## telegram'
            echo '```'
            cat telegram_out.txt 2>/dev/null || echo "(telegram step chala hi nahi)"
            echo '```'
          } > LAST_RUN.md

      - name: used.json + uploads.json + LAST_RUN.md push karo (retry)
        if: always() && steps.slot.outputs.active == 'true'
        run: |
          git config user.name  "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          # Sawaal tabhi "use ho gaya" mana jaaye jab upload sach me hua ho —
          # warna fail hue run ke sawaal hamesha ke liye bank se gayab ho jaate.
          # sync_state.py: remote ka taaza state + is run ke naye entries ka
          # JSON merge, 500/non-fast-forward par 5 baar backoff ke saath retry.
          # (30-Sep: ek push 500 se fail hua, used.json gaya, sawaal repeat hue.)
          INCLUDE_USED=false
          if [ "${{ steps.up.outcome }}" = "success" ] && [ "${{ steps.up.outputs.skipped }}" != "true" ]; then
            INCLUDE_USED=true
          fi
          python src/sync_state.py --branch "${{ github.ref_name }}" \
            --include-used "$INCLUDE_USED" --attempts 5 \
            --message "chore(quiz): ${{ steps.slot.outputs.slot }} run — upload ${{ steps.up.outcome }} [skip ci]"

      - name: Upload fail hua to job fail karo
        if: steps.slot.outputs.active == 'true' && steps.up.outcome != 'success'
        run: |
          echo "Upload fail hua. Detail: kids-quiz-shorts/LAST_RUN.md"
          exit 1
