name: Quiz Pathshala tests

# PR par quiz code ke unit tests. Koi secret nahi chahiye, koi upload nahi.
on:
  pull_request:
    paths:
      - "kids-quiz-shorts/**"
      - ".github/workflows/kids-gk-shorts.yml"
      - ".github/workflows/health-check.yml"
      - ".github/workflows/quiz-catchup.yml"
      - ".github/workflows/quiz-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kids-quiz-shorts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kids-quiz-shorts/requirements.txt
      - name: Devanagari fonts (render test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core >/dev/null
      - run: pip install -r requirements.txt
      - name: Unit tests
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: python -m unittest discover -s tests -v

      # Sirf manual dispatch par: ek sample Short render karke artifact banao,
      # taaki format badlav (PR) upload kiye bina review ho sake. Koi secret
      # nahi, koi YouTube call nahi, used.json me kuch nahi likha jaata.
      - name: Sample render (review only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          QUIZ_TTS_PROVIDER: edge
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python src/build.py --slot evening --dry-run --seed 7

      - name: Upload sample
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: format-proposal-sample
          path: kids-quiz-shorts/out/*/*.mp4
          retention-days: 14
