name: Daily Finance Video

on:
  schedule:
    # 01:00 UTC = 06:30 AM IST daily
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: daily-finance
  cancel-in-progress: false

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install deps
        run: pip install -r requirements.txt

      - name: 1. Pick today's topic
        run: python pick_topic.py

      - name: 2. Script Agent + Gate 1
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_script.py

      - name: 3. Voice Agent + Gate 2
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python run_voice.py

      - name: 4. Visual Agent + Gate 3
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_visuals.py

      - name: 5. Assembly (FFmpeg)
        run: python run_assembly.py

      - name: 6. Final Verify Gate → report
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_verify.py

      - name: Upload video + report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-${{ github.run_number }}
          path: |
            run/final.mp4
            run/report.md
            run/script.txt
          retention-days: 7

      - name: Notify (Telegram)
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py --status "${{ job.status }}"
