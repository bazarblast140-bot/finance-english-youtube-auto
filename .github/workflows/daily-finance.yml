name: Daily Finance Video

on:
  schedule:
    # 13:00 UTC = 9:00 AM EST (US Peak) / 2:00 PM GMT (UK) / 6:30 PM IST daily
    - cron: "0 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-finance
  cancel-in-progress: false

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg & Fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run Pipeline (+ publish if READY)
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        # --publish = opt-in upload; publish.py still only uploads if final verdict == READY
        # and visibility is private (from config.json)
        run: python run_pipeline.py --publish

      - name: Commit topic_bank (prevent topic repeats)
        if: always()
        run: |
          if git diff --quiet topic_bank.json; then
            echo "No topic_bank changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add topic_bank.json
            git commit -m "chore: mark topic used [skip ci]"
            git push
          fi

      - name: Upload video + report as artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-${{ github.run_number }}
          path: |
            run/final.mp4
            run/report.md
            run/script.txt
            run/gate1_report.txt
            run/gate2_report.txt
            run/spoken.txt
          retention-days: 7
