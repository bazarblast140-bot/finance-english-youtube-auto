name: Daily Finance Video

on:
  schedule:
    # 01:00 UTC = 06:30 AM IST daily. GitHub cron can drift a few min under load — fine for daily.
    - cron: "0 1 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-finance
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the used-topic back to topic_bank.json

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline (generate + verify, NO publish)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_pipeline.py

      # pick_topic.py marks the topic used. Without committing that back, every
      # scheduled run would pick topic #1 again and make the same video daily.
      - name: Commit used topic
        if: always()
        run: |
          if ! git diff --quiet -- topic_bank.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add topic_bank.json
            git commit -m "chore: mark topic used (run ${{ github.run_number }})"
            git push
          else
            echo "topic_bank.json unchanged — nothing to commit"
          fi

      - name: Upload video + report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-${{ github.run_number }}
          path: |
            run/final.mp4
            run/report.md
            run/script.txt
          retention-days: 7
